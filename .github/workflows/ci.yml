name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Zsh on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Check Zsh syntax
        shell: zsh {0}
        run: |
          files=(
            zcompile.zsh
            runcoms/*
            lib/*.zsh
            skins/*.zsh
            integrations/*.zsh
            integrations/*/*.zsh
            zshrc.local.example
          )
          for file in $files; do
            [[ $file == *.zwc ]] && continue
            zsh -n "$file"
          done

      - name: Check Bash syntax
        shell: bash
        run: |
          for file in \
            install.sh \
            install.lib.sh \
            integrations/setup.sh \
            integrations/*/setup.sh \
            dev/check-generated-integrations.sh
          do
            bash -n "$file"
          done

      - name: Check integration structure
        run: bash dev/check-integrations.sh

      - name: Check zcompile cache lifecycle
        run: zsh dev/check-zcompile.zsh

      - name: Check generated integration caches
        run: bash dev/check-generated-integrations.sh

      - name: Check automatic Python virtualenvs
        run: zsh dev/check-auto-venv.zsh

      - name: Check prompt namespace
        run: zsh dev/check-prompt-namespace.zsh

      - name: Check normalized prompt state
        run: zsh dev/check-prompt-state.zsh

      - name: Check declarative skins
        run: zsh dev/check-skins.zsh

      - name: Check skin captures
        run: |
          python3 dev/generate-skin-captures.py > "$RUNNER_TEMP/skin-captures.ansi"
          diff -u dev/skin-captures.ansi "$RUNNER_TEMP/skin-captures.ansi"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check installer scripts
        run: |
          shellcheck --external-sources \
            install.sh \
            install.lib.sh \
            integrations/setup.sh \
            integrations/*/setup.sh \
            dev/check-generated-integrations.sh
